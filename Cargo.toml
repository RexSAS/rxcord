[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
flate2 = "1"
thiserror = "2"
tracing = "0.1"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
rand = "0.9"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
wiremock = "0.6"
slint = { version = "~1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "unstable-winit-030", "renderer-software", "renderer-femtovg", "accessibility"] }
slint-build = "1"
keyring = { version = "3", features = ["async-secret-service", "tokio", "crypto-rust", "windows-native"] }
qrcode = { version = "0.14", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
lru = "0.16"
opener = "0.8"
notify-rust = { version = "4", default-features = false, features = ["z"] }
